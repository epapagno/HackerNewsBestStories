apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: epapagno-hackernews-ingress
spec:
  ingressClassName: epapagno-traefik
  rules:
    - http:
        paths:
          - path: /api/stories
            pathType: Prefix
            backend:
              service:
                name: epapagno-hackernews-api
                port:
                  number: 8080
