apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: epapagno-postgres
spec:
  serviceName: epapagno-postgres
  replicas: 1
  selector:
    matchLabels:
      app: epapagno-postgres
  template:
    metadata:
      labels:
        app: epapagno-postgres
    spec:
      containers:
        - name: epapagno-postgres
          image: postgres:17
          ports:
            - containerPort: 5432
          envFrom:
            - secretRef:
                name: epapagno-postgres-secret
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: postgres-data
          persistentVolumeClaim:
            claimName: epapagno-postgres-pvc
