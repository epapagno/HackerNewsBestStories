apiVersion: apps/v1
kind: Deployment
metadata:
  name: epapagno-hackernews-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: epapagno-hackernews-api
  template:
    metadata:
      labels:
        app: epapagno-hackernews-api
    spec:
      containers:
      - name: epapagno-hackernews-api
        image: epapagno-hackernews-api:1.2
        imagePullPolicy: Never
        ports:
          - containerPort: 8080
        livenessProbe:
          httpGet:
            path: /health/live
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health/ready
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
      resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "500m"
            memory: "256Mi"